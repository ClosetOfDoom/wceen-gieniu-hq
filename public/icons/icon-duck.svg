<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Navy background -->
  <rect width="512" height="512" rx="90" fill="#0b1e29"/>
  <!-- Gold border ring -->
  <rect x="10" y="10" width="492" height="492" rx="82" fill="none" stroke="#ee9d00" stroke-width="16"/>

  <!-- Body -->
  <ellipse cx="288" cy="345" rx="150" ry="108" fill="#f5f0e6"/>
  <!-- Neck (connects head to body) -->
  <ellipse cx="222" cy="268" rx="52" ry="70" fill="#f5f0e6"/>
  <!-- Head -->
  <circle cx="206" cy="196" r="80" fill="#f5f0e6"/>

  <!-- Bill — gold -->
  <path d="M 142 214 L 70 199 L 70 231 L 138 233 Z" fill="#ee9d00"/>
  <!-- Bill highlight -->
  <path d="M 142 214 L 70 199 L 76 208 L 142 222 Z" fill="#f5b500" opacity="0.5"/>

  <!-- Eye -->
  <circle cx="182" cy="180" r="14" fill="#0b1e29"/>
  <circle cx="177" cy="175" r="5" fill="#ffffff"/>

  <!-- Wing shading -->
  <path d="M 188 302 Q 305 272 412 330 Q 328 385 204 362 Z" fill="#ddd8cc" opacity="0.70"/>
  <!-- Wing edge highlight -->
  <path d="M 195 295 Q 295 268 398 318" fill="none" stroke="#c8c3b8" stroke-width="3" opacity="0.5"/>

  <!-- Tail -->
  <path d="M 422 312 Q 476 278 468 348 Q 446 376 418 346 Z" fill="#eae5da"/>

  <!-- Bottom shadow (gives depth) -->
  <ellipse cx="288" cy="440" rx="140" ry="12" fill="#000000" opacity="0.15"/>
</svg>
